name: Development Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  workflow-and-shell-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint"
      - name: Run ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mapfile -t scripts < <(find . -path './.git' -prune -o -path './frontend/node_modules' -prune -o -type f -name '*.sh' -print)
          if ((${#scripts[@]} == 0)); then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck -S error -x "${scripts[@]}"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -e . pip-audit
          # CVE-2025-69872 affects diskcache 5.6.3, and pip-audit currently
          # reports no fixed release. Keep auditing every other dependency.
          pip-audit --ignore-vuln CVE-2025-69872 --local --progress-spinner off
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

  checkov:
    name: Checkov
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
      - name: Upload Checkov SARIF
        if: ${{ always() && hashFiles('checkov-results.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check SonarQube configuration
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping SonarQube because SONAR_TOKEN is not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run SonarQube scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
