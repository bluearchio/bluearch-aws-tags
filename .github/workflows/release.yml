name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY_NAME: tag-manager
  HOMEBREW_FORMULA: bluearch-aws-tags
  HOMEBREW_TAP_REPO: bluearchio/homebrew-tap
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  linux:
    name: Linux release binary
    runs-on: ubuntu-22.04
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Stamp release version
        shell: python
        run: |
          import os
          from pathlib import Path

          release_tag = os.environ["RELEASE_TAG"]
          version_file = Path("tag_manager_cli/__init__.py")
          version_text = version_file.read_text()
          version_text = version_text.replace('__version__ = "LOCAL"', f'__version__ = "{release_tag}"')
          version_file.write_text(version_text)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -e .
          python -m pip install -r build-requirements.txt
      - name: Build Linux binary
        run: bash scripts/build_nuitka_linux.sh
      - name: Package Linux asset
        shell: bash
        run: |
          mkdir -p artifacts
          tar -C dist -czf "artifacts/$BINARY_NAME-linux-x86_64.tar.gz" "$BINARY_NAME"
      - name: Generate Linux SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/${{ env.BINARY_NAME }}-linux-x86_64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: Signed macOS release binary
    runs-on: macos-14
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Stamp release version
        shell: python
        run: |
          import os
          from pathlib import Path

          release_tag = os.environ["RELEASE_TAG"]
          version_file = Path("tag_manager_cli/__init__.py")
          version_text = version_file.read_text()
          version_text = version_text.replace('__version__ = "LOCAL"', f'__version__ = "{release_tag}"')
          version_file.write_text(version_text)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -e .
          python -m pip install -r build-requirements-macos.txt
      - name: Build unsigned macOS binary
        run: bash scripts/build_nuitka_macos.sh
      - name: Prepare macOS artifacts directory
        run: mkdir -p artifacts
      - name: Generate macOS SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/${{ env.BINARY_NAME }}-macos-arm64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Import Apple signing assets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 || secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD || secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_CODESIGN_IDENTITY_SECRET: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          export KEYCHAIN_PATH KEYCHAIN_PASSWORD
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          (temp / "developer_id.p12").write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"]))
          api_key_id = os.environ.get("APPLE_API_KEY_ID")
          api_key = os.environ.get("APPLE_API_KEY_P8_BASE64")
          if api_key_id and api_key:
              (temp / f"AuthKey_{api_key_id}.p8").write_bytes(base64.b64decode(api_key))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          identity="${MACOS_CODESIGN_IDENTITY_SECRET:-}"
          if [[ -z "$identity" ]]; then
            identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          fi
          if [[ -z "$identity" ]]; then
            echo "::error::Developer ID Application certificate not found in imported keychain."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "MACOS_CODESIGN_IDENTITY=$identity"
          } >> "$GITHUB_ENV"
      - name: Codesign and notarize macOS asset
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          trap 'security delete-keychain "$KEYCHAIN_PATH" || true' EXIT
          if [[ -z "${MACOS_CODESIGN_IDENTITY:-}" ]]; then
            echo "::error::Missing required signing secret: MACOS_CODESIGN_IDENTITY"
            exit 1
          fi
          codesign --force --timestamp --options runtime --entitlements entitlements.plist --sign "$MACOS_CODESIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "dist/$BINARY_NAME"
          codesign --verify --strict --verbose=2 "dist/$BINARY_NAME"
          mkdir -p artifacts
          ditto -c -k --keepParent "dist/$BINARY_NAME" "artifacts/$BINARY_NAME-macos-arm64.zip"
          if [[ -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER_ID:-}" && -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" ]]; then
            xcrun notarytool submit "artifacts/$BINARY_NAME-macos-arm64.zip" \
              --key "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait
          elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_ID_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            xcrun notarytool submit "artifacts/$BINARY_NAME-macos-arm64.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          else
            echo "::error::Missing notarization credentials. Configure APPLE_API_KEY_* secrets or APPLE_ID, APPLE_ID_PASSWORD, and APPLE_TEAM_ID."
            exit 1
          fi
          xcrun stapler staple "artifacts/$BINARY_NAME-macos-arm64.zip" || \
            echo "::notice::Notarization succeeded; zip stapling is not required for this CLI artifact."
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish signed release
    runs-on: ubuntu-24.04
    needs: [linux, macos]
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\0' | \
            sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*
      - name: Validate Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN_2 }}
        shell: bash
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::error::Missing HOMEBREW_TAP_TOKEN_2. Create a fine-grained token scoped to ${HOMEBREW_TAP_REPO} contents and pull requests."
            exit 1
          fi
      - name: Publish draft release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Create a new tag instead of mutating release assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN_2 }}
          path: homebrew-tap
          persist-credentials: false
      - name: Update Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          asset="${BINARY_NAME}-macos-arm64.zip"
          sha256="$(sha256sum "release-assets/${asset}" | awk '{print $1}')"
          python3 homebrew-tap/scripts/update_formula.py \
            --formula "homebrew-tap/Formula/${HOMEBREW_FORMULA}.rb" \
            --repo "${GITHUB_REPOSITORY}" \
            --version "${RELEASE_TAG}" \
            --asset "${asset}" \
            --sha256 "${sha256}" \
            --binary "${BINARY_NAME}"
          ruby -c "homebrew-tap/Formula/${HOMEBREW_FORMULA}.rb"
      - name: Open Homebrew tap pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN_2 }}
        shell: bash
        run: |
          set -euo pipefail
          cd homebrew-tap
          branch="release/${HOMEBREW_FORMULA}-${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add "Formula/${HOMEBREW_FORMULA}.rb"
          if git diff --cached --quiet; then
            echo "No Homebrew formula changes."
            exit 0
          fi
          git commit -m "chore: update ${HOMEBREW_FORMULA} to ${RELEASE_TAG}"
          gh auth setup-git -h github.com
          git push --force-with-lease origin "${branch}"
          if gh pr list --repo "${HOMEBREW_TAP_REPO}" --head "${branch}" --json number --jq '.[0].number // empty' | grep -q .; then
            echo "Homebrew tap pull request already exists."
          else
            gh pr create \
              --repo "${HOMEBREW_TAP_REPO}" \
              --base main \
              --head "${branch}" \
              --title "chore: update ${HOMEBREW_FORMULA} to ${RELEASE_TAG}" \
              --body "Updates ${HOMEBREW_FORMULA} to ${RELEASE_TAG} from ${GITHUB_REPOSITORY}."
          fi
