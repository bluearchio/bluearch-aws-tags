# Redis configuration for Tag Manager CLI

# Basic settings
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# Memory and persistence
maxmemory 512mb
maxmemory-policy allkeys-lru
save 60 1000

# Logging
loglevel notice
logfile ""

# Security
# requirepass your_redis_password_here  # Uncomment and set password for production

# Persistence
dir /data
dbfilename dump.rdb
appendonly yes
appendfsync everysec

# Network
tcp-backlog 511

# General
databases 16
